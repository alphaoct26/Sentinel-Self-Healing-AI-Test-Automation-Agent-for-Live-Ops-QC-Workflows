name: Test Suite

'on':
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Sentinel Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium

      - name: Start Target Application Server
        run: |
          python target-app/server.py &
          echo "Waiting for target application server on http://localhost:3001..."
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:3001 > /dev/null 2>&1; then
              echo "Target application server is up and responding."
              break
            fi
            sleep 1
          done

      - name: Execute Sentinel Test Suite via CLI Runner
        run: |
          python src/cli.py run

      - name: Execute Pytest Suite
        run: |
          pytest -v

      - name: Upload Test Run Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-run-artifacts
          path: artifacts/runs/
          if-no-files-found: ignore
